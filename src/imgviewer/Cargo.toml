[package]
name = "ic-imgviewer"
version = "0.1.0"
edition = "2021"
description = "Shows pictures, the photograph inside a camera raw file included"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-plugin-api = { workspace = true }
serde_json = { workspace = true }
kamadak-exif = { workspace = true }

[dev-dependencies]
ic-plugin-api = { workspace = true, features = ["testing"] }

[features]
default = ["export-abi"]
export-abi = []
